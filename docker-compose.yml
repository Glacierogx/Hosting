version: '3.8'

networks:
  pterodactyl:
    driver: bridge

services:
  database:
    image: mariadb:10.6
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "SuperSecretRootPassword123!"
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"
      MYSQL_PASSWORD: "StrongPass123!"
    networks:
      - pterodactyl

  cache:
    image: redis:alpine
    restart: always
    networks:
      - pterodactyl

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    links:
      - database
      - cache
    volumes:
      - ./data/var:/app/var/
      - ./data/nginx:/etc/nginx/http.d/
      - ./data/certs:/etc/letsencrypt/
      - ./data/logs:/app/storage/logs
    environment:
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      APP_URL: "http://103.165.11.4"
      APP_TIMEZONE: "Asia/Kolkata"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_DATABASE: "panel"
      DB_USERNAME: "pterodactyl"
      DB_PASSWORD: "StrongPass123!"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "cache"
    networks:
      - pterodactyl
